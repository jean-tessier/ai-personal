# negative-small-change. The skill says "Not for a single small change you can just make".
# Pass: src/routes/tasks.ts ends with DEFAULT_PAGE_SIZE = 50; no file created; no DAG written; no plan or decision
# list in the reply. Indicator: the skill is not invoked.
# Classes: o-* outcome (all arms) | i-* indicator | v-* validity.
schema_version: "1.0"
name: negative-small-change
tags: [behaviour]
plugins: [../../work/arm/plan-dag]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Change the default page size in src/routes/tasks.ts from 20 to 50.
graders:
  - name: o-page-size-50
    type: regex
    target: {source: file, path: src/routes/tasks.ts}
    pattern: 'DEFAULT_PAGE_SIZE\s*=\s*50\b'
  - name: o-no-files-created
    type: regex
    target: files
    pattern: '\S'
    match: not_contains
  - name: o-no-dag-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*-dag\.md"'
    min: 0
    max: 0
  - name: o-j1-direct-change
    type: llm
    focus: last_message
    criteria: >-
      PASS only if the reply reports that the default page size in src/routes/tasks.ts was changed from 20 to 50,
      and does not present a multi-step plan, a dependency graph, or a list of decisions for the user before acting.
      FAIL if it plans instead of making the change, asks the user to decide something first, or says the change was
      not made. Judge only the substance of the reply; ignore any mention of tools, skills, templates or how the
      change was produced.
  - name: i-skill-not-invoked
    type: tool_used
    tool: Skill
    input_match: 'plan-dag'
    min: 0
    max: 0
    arm: with-only
  - name: v-not-contaminated
    type: regex
    target: trace
    pattern: 'case\.yaml|evals/plan-dag/(?:cases|fixtures)'
    match: not_contains
  - name: v-isolated
    type: regex
    target: trace
    pattern: 'private global instructions|user.s auto-memory|SessionStart|SubagentStart|hook additional context|hook success|Contents of [^"]{0,200}/\.claude/CLAUDE\.md'
    match: not_contains
