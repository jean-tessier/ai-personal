# adr-conflict. Trap: docs/adrs/ADR-0002-sqlite-only.md (accepted) says SQLite is the only datastore and the app
# runs no external runtime services. A Redis cache conflicts with it.
# Pass: names ADR-0002, puts the conflict to the user (recommendation welcome), Redis-dependent slices wait.
# Classes: o-* outcome (all arms) | s-* skill convention (with-only) | i-* indicator | v-* validity.
schema_version: "1.0"
name: adr-conflict
tags: [behaviour]
plugins: [../../work/arm/plan-dag]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Plan adding a Redis cache in front of task queries, a few PRs, cost-appropriate model per task. Plan only; include the plan in your reply.
graders:
  - name: o-no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: o-no-repo-writes-bash
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*(?:add|commit|push|checkout|reset|switch|stash|merge|rebase|restore|rm|mv|apply|cherry-pick|clean|tag|am)\b|\bsed\s+-i|\bperl\s+-p?i'
    min: 0
    max: 0
  - name: o-no-files-created
    type: regex
    target: files
    pattern: '^(?!\.claude/|data/|dist/|node_modules/)\S'
    flags: m
    match: not_contains
  - name: o-adr-named
    type: regex
    target: last_message
    pattern: 'ADR-0002'
  - name: o-j1-adr-conflict
    type: llm
    focus: last_message
    criteria: >-
      PASS only if the reply identifies that a Redis cache conflicts, or may conflict, with ADR-0002 (SQLite is the
      only datastore; no external runtime services), puts that conflict to the user as a question to decide (a
      recommendation is welcome), and makes every Redis-dependent step wait for or depend on the user's answer. FAIL
      if it ignores ADR-0002, settles the conflict itself (proceeding with Redis anyway, or replacing Redis with
      something else without asking), or plans Redis work as unconditional. Judge only the substance of the reply;
      ignore any mention of tools, skills, templates or how the plan was produced.
  - name: o-j3-slicing
    type: llm
    focus: last_message
    criteria: >-
      PASS only if the work is split into several slices that each carry one concern; each build slice is plausibly
      at or under 200 changed lines, the repository's pull-request size rule; dependencies between slices reflect
      real ordering needs; and any change to stored data or to a public API contract is done expand-then-contract
      (add the new form and read from it first, switch writers next, remove the old form last). FAIL if a slice
      bundles unrelated concerns, a slice is clearly over 200 changed lines, or stored data or a public contract is
      changed in one breaking step. Judge only the substance of the reply; ignore any mention of tools, skills,
      templates or how the plan was produced.
  - name: o-j4-models
    type: llm
    focus: last_message
    criteria: >-
      PASS only if every planned task names who does it (a model tier, the orchestrating session, or the owner);
      judgement-heavy work such as design, security, review and the decisions themselves goes to the most capable
      model or to the owner; fully specified build tasks go to a mid-tier model rather than the most capable one;
      and no small or cheap model is given push, deploy, credential or secret work, or code that no one will
      review. FAIL if a task has no assignee, every task goes to the same model, or the cheapest model handles push,
      deploy, credentials or unreviewed code. Judge only the substance of the reply; ignore any mention of tools,
      skills, templates or how the plan was produced.
  - name: o-j6-owner-questions
    type: llm
    focus: last_message
    criteria: >-
      PASS only if each decision the plan needs from the user is named as a decision for the user, comes with a
      recommended option and the consequence of each option (for example cost, what changes, or whether it can be
      undone), and the reply asks the user to rule on it in any form (a direct question, "tell me which option", or
      a list of questions). FAIL if a decision the plan depends on has no recommendation or no consequences, is
      stated as a bare "your call" remark without either, or is settled without asking the user. Judge only the
      substance of the reply; ignore any mention of tools, skills, templates or how the plan was produced.
  - name: s-dag-written
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*-dag\.md"'
    arm: with-only
  - name: s-dag-state-attempt
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*\.claude/state/[^"]+-dag\.md"'
    arm: with-only
  - name: s-cells-filled
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*"file_path":"[^"]*-dag\.md")[\s\S]*\|[ \t]*\|'
    min: 0
    max: 0
    arm: with-only
  - name: s-no-bare-na
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*"file_path":"[^"]*-dag\.md")[\s\S]*\|[ \t]*(?:n/?a|N/?A|-|—|–)[ \t]*\|'
    min: 0
    max: 0
    arm: with-only
  - name: s-plan-only-close
    type: regex
    target: last_message
    pattern: 'nothing (?:was |has been )?(?:built|dispatched|pushed|changed)'
    flags: i
    arm: with-only
  - name: s-j5-stop-conditions
    type: llm
    focus: last_message
    arm: with-only
    criteria: >-
      PASS only if every build and review step in the plan has a concrete stop condition (a measurable trigger such
      as a size limit, a failing check or a contradiction to escalate); owner, glue and done steps either have a
      stop condition or say none with a reason; and every step that queues, merges or releases says to stop and
      hold when the newest main-branch CI run or release is red, or the plan states that the repository has no
      release pipeline. FAIL if any build or review step lacks a stop condition, or any stop condition is a bare
      n/a or dash.
  - name: i-skill-invoked
    type: tool_used
    tool: Skill
    input_match: 'plan-dag'
    arm: with-only
  - name: v-not-contaminated
    type: regex
    target: trace
    pattern: 'case\.yaml|evals/plan-dag/(?:cases|fixtures)'
    match: not_contains
  - name: v-isolated
    type: regex
    target: trace
    pattern: 'private global instructions|user.s auto-memory|SessionStart|SubagentStart|hook additional context|hook success|Contents of [^"]{0,200}/\.claude/CLAUDE\.md'
    match: not_contains
