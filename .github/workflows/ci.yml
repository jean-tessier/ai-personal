name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: validate, test, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: make check

  test-install:
    name: installer behavioral tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: bash scripts/test-install.sh
